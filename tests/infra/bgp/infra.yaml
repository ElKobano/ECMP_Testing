---
# ECMP 2-path basic topology.
#
#   client .10 --- cli --- [ dut ] --- p1 --- r1 .2
#   (203.0.113.0/24)                --- p2 --- r2 .2

networks:
  cli: {subnet: 203.0.113.0/24, gateway: 203.0.113.254, internal: true}
  p1:  {subnet: 10.0.1.0/24,    gateway: 10.0.1.254,    internal: true}
  p2:  {subnet: 10.0.2.0/24,    gateway: 10.0.2.254,    internal: true}

containers:
  dut:
    image: networkop/cx:5.3.0
    role: dut
    privileged: true
    cap_add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
    networks: {cli: 203.0.113.1, p1: 10.0.1.1, p2: 10.0.2.1}

  client:
    image: stepanenko/generator
    role: client
    privileged: true
    cap_add: [NET_ADMIN, NET_RAW]
    networks: {cli: 203.0.113.10}

  r1:
    image: networkop/cx:5.3.0
    role: router
    privileged: true
    cap_add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
    networks: {p1: 10.0.1.2}

  r2:
    image: networkop/cx:5.3.0
    role: router
    privileged: true
    cap_add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
    networks: {p2: 10.0.2.2}
...