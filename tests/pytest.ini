[pytest]
testpaths = .
addopts = -v -ra
markers =
    infra:        Select topology (2path / basic / ospf / bgp)
    routes:       ECMP route installation tests (static / OSPF / BGP)
    hashing:      Deterministic hashing by source IP
    distribution: Traffic distribution across ECMP paths (IPv4 / IPv6)
    dynamic:      Dynamic path add/remove and topology change scenarios
    negative:     Negative and edge-case scenarios
    config:       Hash-field combination and configuration persistence
    e2e:          End-to-end integration scenarios
